<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mama ke liye 🌿</title><meta name="theme-color" content="#08130F">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08130F;--c1:#0E1F18;--c2:#143025;--gold:#D8B35E;--gold2:#F4E2A8;--ink:#F6EFE0;--mute:#A9B5A9;--ln:#d8b35e40;--h:'Fraunces',Georgia,serif;--b:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{background:var(--bg);scroll-behavior:smooth}
body{color:var(--ink);font:400 17px/1.65 var(--b);padding:env(safe-area-inset-top) 18px calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(600px 420px at 10% 5%,#d8b35e2e,transparent 65%),radial-gradient(700px 520px at 95% 40%,#2f8f6a33,transparent 65%);animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(4%,3%) scale(1.1)}}
#sp{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{max-width:600px;margin:0 auto;position:relative;z-index:1}
.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:13px;color:var(--mute)}
.live{display:inline-flex;gap:8px;align-items:center;background:var(--c1);border:1px solid var(--ln);border-radius:99px;padding:6px 14px}
.live i{width:8px;height:8px;border-radius:50%;background:#5CE0A0;box-shadow:0 0 0 0 #5ce0a088;animation:pl 1.6s infinite}@keyframes pl{to{box-shadow:0 0 0 9px #5ce0a000}}
h1{font:700 clamp(34px,10vw,52px)/1.08 var(--h);margin:14px 0 10px;background:linear-gradient(100deg,var(--ink),var(--gold2) 40%,var(--gold) 55%,var(--ink) 75%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}@keyframes sh{to{background-position:-200% center}}
.sub{color:var(--mute);min-height:1.7em}.sub b{display:inline-block;width:2px;height:1em;background:var(--gold);vertical-align:-2px;animation:bk 1s steps(2) infinite}@keyframes bk{50%{opacity:0}}
.ph{position:relative;margin:26px auto;width:min(300px,78%);aspect-ratio:3/4;border-radius:22px;padding:4px;animation:fl 7s ease-in-out infinite alternate}
.ph::before{content:"";position:absolute;inset:0;border-radius:22px;background:conic-gradient(from var(--a),var(--gold),#2f8f6a,var(--gold2),var(--gold));animation:sp 8s linear infinite}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes sp{to{--a:360deg}}@keyframes fl{to{transform:translateY(-10px)}}
.ph img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:19px;display:block}
.cap{text-align:center;font:600 19px var(--h);color:var(--gold2);margin-top:-8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}
.tile{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:14px 16px}.tile small{display:block;color:var(--mute);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.tile b{font:600 24px var(--h);color:var(--gold2);font-variant-numeric:tabular-nums}
h2{font:600 22px var(--h);color:var(--gold2);margin:34px 0 4px}.lead{color:var(--mute);font-size:15px;margin-bottom:14px}
.gt{position:relative;margin:0 0 16px;border-radius:20px;perspective:1000px;cursor:pointer;border:1px solid var(--ln);background:var(--c2);overflow:hidden}
.gr{padding:22px 20px;opacity:0;transform:scale(.96);transition:opacity .8s .5s,transform .8s .5s}.gr p{white-space:pre-line}.gr .big{font:700 26px var(--h);color:var(--gold);margin-bottom:6px}
.lf{position:absolute;top:0;bottom:0;width:50%;z-index:2;background:linear-gradient(90deg,#10261c,#1c4533 50%,#10261c);box-shadow:inset 0 0 0 5px #0004;display:flex;align-items:center;transition:transform 1.1s cubic-bezier(.5,0,.2,1);font:600 18px var(--h);color:var(--gold2)}
.lf.l{left:0;transform-origin:left;justify-content:flex-end;padding-right:36px}.lf.r{right:0;transform-origin:right;justify-content:flex-start;padding-left:36px;font-size:0}
.lf::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold)}.lf.l::after{right:12px}.lf.r::after{left:12px}
.hint{position:absolute;z-index:3;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--gold2);background:#000a;padding:3px 12px;border-radius:99px;transition:opacity .4s}
.gt.open{cursor:default}.gt.open .lf.l{transform:rotateY(-88deg)}.gt.open .lf.r{transform:rotateY(88deg)}.gt.open .gr{opacity:1;transform:none}.gt.open .hint{opacity:0}
.soon{text-align:center;background:linear-gradient(135deg,#2a2410,var(--c2));border:1px solid var(--ln);border-radius:22px;padding:26px 20px;margin-top:10px}
.soon .lk{font-size:34px}.soon h3{font:700 24px var(--h);color:var(--gold2);margin:4px 0}.cd{font:700 34px var(--h);color:var(--gold);font-variant-numeric:tabular-nums;margin-top:8px}
footer{margin-top:36px;text-align:center;color:var(--mute);font-size:14px}
#in{position:fixed;inset:0;z-index:50;background:#050c09;display:grid;place-items:center;padding:20px;transition:opacity .9s,visibility .9s;cursor:pointer}
#in.gone{opacity:0;visibility:hidden}
.fr{position:relative;width:min(300px,72vw);aspect-ratio:3/4;background:#2a3a30;padding:12px;border-radius:8px 8px 0 0;box-shadow:0 24px 60px #000a;perspective:900px}
.rm{position:absolute;inset:12px;overflow:hidden}.rm img{width:100%;height:100%;object-fit:cover;filter:brightness(.4);transform:scale(.9);transition:transform 1.6s .4s ease-out,filter 1.4s .4s}
.dl{position:absolute;top:12px;bottom:12px;width:calc(50% - 12px);background:linear-gradient(90deg,#3b2f2a,#5a4637 50%,#3b2f2a);box-shadow:inset 0 0 0 6px #0003;transition:transform 1.3s cubic-bezier(.5,0,.2,1)}
.dl.l{left:12px;transform-origin:left}.dl.r{right:12px;transform-origin:right}.dl::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold)}.dl.l::after{right:10px}.dl.r::after{left:10px}
#in.go .dl.l{transform:rotateY(-82deg)}#in.go .dl.r{transform:rotateY(82deg)}#in.go .rm img{transform:none;filter:none}
.tp{position:absolute;bottom:-46px;left:0;right:0;text-align:center;color:var(--gold2);font:600 16px var(--h);animation:bk 1.6s steps(2) infinite}.tp small{display:block;color:var(--mute);font:400 13px var(--b);margin-bottom:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<canvas id="sp"></canvas>
<div id="in"><div class="fr"><div class="rm"><img src="assets/couple.jpg" alt=""></div><div class="dl l"></div><div class="dl r"></div><div class="tp"><small>Aruma ki taraf se</small>Mama, darwaza kholiye 🚪</div></div></div>
<main>
<div class="bar"><span class="live"><i></i>Live</span><span id="clk"></span></div>
<h1 id="h"></h1><p class="sub"><span id="ty"></span><b></b></p>
<figure><div class="ph"><img src="assets/couple.jpg" alt="Bhai aur Bhabhi"></div><figcaption class="cap">Bhai aur Bhabhi 🤍</figcaption></figure>
<div class="tiles"><div class="tile"><small>Paigham</small><b>3 khat</b></div><div class="tile"><small>Tohfa</small><b id="st">Coming soon</b></div></div>
<h2>Aap ke liye 3 darwaze</h2><p class="lead">Har darwaza dabaiye, khul jaye ga. 🚪</p>
<div class="gt" data-t="Mubarak"><div class="lf l">Mubarakbaad</div><div class="lf r"></div><span class="hint">tap to open</span><div class="gr"><p class="big">Bohat bohat mubarak! 🎉</p><p id="m"></p></div></div>
<div class="gt" data-t="Maazrat"><div class="lf l">Maazrat</div><div class="lf r"></div><span class="hint">tap to open</span><div class="gr"><p id="s"></p></div></div>
<div class="gt" data-t="Shukriya"><div class="lf l">Shukriya, Mama</div><div class="lf r"></div><span class="hint">tap to open</span><div class="gr"><p id="t"></p></div></div>
<div class="soon"><div class="lk" id="lk">🔒</div><h3>Ek chhota sa tohfa 🎁</h3><div class="cd" id="c"></div></div>
<footer>Aap ki beti, Aruma 🤍</footer>
</main>
<script>
// ===== EDIT HERE =====
const MAMA="Mama",BHAI="Bhai",BHABHI="Bhabhi";
const UNLOCK="2026-10-24T14:00"; // Pakistan time
// =====================
const $=i=>document.getElementById(i);
const H=`Assalamualaikum, ${MAMA}.`;
$("m").textContent=`${BHAI} aur ${BHABHI} ke nikah ki dil se mubarakbaad. Allah is rishte ko pyar, sukoon aur barkat se bhar de, aur aap sab ke ghar mein khushiyan rahein. Ameen.`;
$("s").textContent=`Mujhe is khushi ki mubarak sab se pehle deni chahiye thi, aur mujhe ehsaas hai ke mujh se der ho gayi. Agar is se aap ko dukh hua ho to main dil se maafi chahti hoon. Aap mere liye bohat qabil-e-izzat hain, aur mera iraada aap ka dil dukhane ka kabhi nahi tha.`;
$("t").textContent=`Aap ne mujhe "beti" kaha. Hum ek dusre ko zyada arse se nahi jaante, phir bhi aap ne mujhe paraya nahi samjha, aur is ek lafz ne mujhe is ghar ka hissa bana diya.\n\nMudassir jaisa pyara beta aap ne paala hai, us ki har achi baat mein aap ki tarbiyat nazar aati hai. Allah aap ko sehat aur lambi umar de.\n\nAur jab aap mujhe pyar se "bewi" kehti hain to dil khush ho jata hai. Bewi ka kaam hi hota hai husband ko tang karna, to Mudassir ko tang karne ki ijazat bhi aap hi se mil gayi samajhti hoon. 😄`;
$("t").style.whiteSpace="pre-line";
// typing
let i=0;const sub="Aap ke liye, dil se. 🌿";(function ty(){$("ty").textContent=sub.slice(0,i++);if(i<=sub.length)setTimeout(ty,70)})();
$("h").textContent=H;
// doors
document.querySelectorAll(".gt").forEach(g=>g.onclick=()=>g.classList.add("open"));
// intro door
$("in").onclick=()=>{const e=$("in");if(e.classList.contains("go"))return;e.classList.add("go");setTimeout(()=>e.classList.add("gone"),2600)};
// clock + countdown
const P=new URLSearchParams(location.search);let off=P.get("t")?new Date(P.get("t")+":00+05:00")-Date.now():0;if(isNaN(off))off=0;
const U=new Date(UNLOCK+":00+05:00").getTime(),p=x=>String(x).padStart(2,"0");
function tick(){const n=Date.now()+off,r=Math.floor((U-n)/1000);
$("clk").textContent=new Date(n).toLocaleTimeString("en-GB",{timeZone:"Asia/Karachi",hour:"numeric",minute:"2-digit",hour12:true});
if(r>0){$("c").textContent=`${r>=86400?(r/86400|0)+"d ":""}${p(r%86400/3600|0)}:${p(r%3600/60|0)}:${p(r%60)}`}
else{$("c").textContent="Aa gaya! 🎁";$("lk").textContent="🎁";$("st").textContent="Aa gaya 🎁"}}
tick();setInterval(tick,1000);
// sparks
const cv=$("sp"),x=cv.getContext("2d");let d=[];function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
for(let k=0;k<38;k++)d.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.5,v:Math.random()*.35+.1});
(function a(){x.clearRect(0,0,cv.width,cv.height);d.forEach(s=>{s.y-=s.v;if(s.y<-5){s.y=cv.height+5;s.x=Math.random()*cv.width}x.fillStyle="rgba(216,179,94,.55)";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(a)})();
</script></body></html>
